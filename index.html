<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="What actually happens inside a desktop PC between pressing the power button and reaching the login screen, walked through step by step as signal flow on a 3D motherboard."
    />
    <title>Boot Anatomy — From power button to login screen</title>
  </head>
  <body>
    <div id="app">
      <!--
        The scene is decorative in the strict sense: everything it shows is also
        written out in the step card, which is a live region. Labelling it as an
        image with a summary beats both leaving it unnamed and pretending a
        screen reader can follow 190 animated steps through it.
      -->
      <canvas
        id="scene-canvas"
        role="img"
        aria-label="A 3D desktop motherboard with a power supply and a monitor. Signals animate along it as the boot chain plays; each step is described in text in the step card."
      ></canvas>
      <!-- CSS2DRenderer renders the on-PCB labels into this layer -->
      <div id="labels-layer"></div>
      <!-- The entire DOM interface (panels, buttons, console) is mounted here -->
      <div id="ui-layer"></div>
    </div>
    <noscript>
      <p style="color: #e6edf3; font-family: sans-serif; padding: 2rem">
        You need to use JavaScript and WebGL to view this content.
        
      </p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
